name: THE LORD ERP — CI & Security Validation Pipeline

on:
  push:
    branches: [ main, ManusEdit, ManusEditGemini ]
  pull_request:
    branches: [ main, ManusEdit, ManusEditGemini ]

jobs:
  validate-and-build:
    name: Build, Lint & Type-Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies with clean slate
        run: npm ci

      - name: 🔍 TypeScript Check (Shared Types)
        run: |
          if [ -d "packages/shared-types" ]; then
            cd packages/shared-types && npm run build --if-present && cd ../..
          fi

      - name: 🔍 TypeScript Check (API)
        run: npx tsc --noEmit --project apps/api/tsconfig.json

      - name: 🔍 TypeScript Check (Web)
        run: npx tsc --noEmit --project apps/web/tsconfig.json

      - name: 🛡️ Secret Scan (Detect Leaked Credentials)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
        continue-on-error: true

      - name: 🏗️ Test Build (API)
        run: |
          cd apps/api
          npm run build --if-present
          cd ../..

      - name: 🧪 Automated Test Suite (RBAC, Accounting, Storage, BEP20)
        run: npm test

